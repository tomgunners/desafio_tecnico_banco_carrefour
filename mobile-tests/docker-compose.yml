# docker-compose.yml — Ambiente local com docker-android (Android 15)

services:
  android:
    image: budtmo/docker-android:emulator_15.0
    container_name: mobile-tests-android-1
    privileged: true
    ports:
      - "6080:6080"   # VNC Web — acesse http://localhost:6080
      - "4723:4723"   # Appium Server
      - "5555:5555"   # ADB
    environment:
      - EMULATOR_DEVICE=Samsung Galaxy S10
      - WEB_VNC=true
      - APPIUM=true

      # 🔥 Ajustado para Android 15 (mais pesado)
      - MEMORY=6144
      - DATAPARTITION=6144

      # Flags otimizadas para WSL2 (estabilidade > performance bruta)
      - EMULATOR_ARGS=-no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -no-accel

    volumes:
      - ./apps:/apps

    devices:
      - /dev/kvm:/dev/kvm

    shm_size: "2gb"

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4723/status"]
      interval: 10s
      timeout: 5s
      retries: 30

      # ⏱️ Android 15 demora mais pra subir
      start_period: 180s