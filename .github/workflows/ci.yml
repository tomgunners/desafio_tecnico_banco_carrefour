name: CI – API & Mobile Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  NODE_VERSION: '22'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 – Testes de API (MANTIDO EXATAMENTE)
  # ─────────────────────────────────────────────
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-node-modules-api
        with:
          path: |
            node_modules
            api-tests/node_modules
          key: api-node-modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            api-node-modules-${{ runner.os }}-

      - name: Install dependencies
        if: steps.cache-node-modules-api.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile

      - name: Copy environment file
        working-directory: api-tests
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Run API tests
        working-directory: api-tests
        run: yarn test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report-${{ github.run_number }}
          path: |
            api-tests/mochawesome-report/
            api-tests/reports/
          if-no-files-found: warn
          retention-days: 7

  # ─────────────────────────────────────────────
  # JOB 2 – ANDROID (CORRIGIDO)
  # ─────────────────────────────────────────────
  mobile-android:
    name: Mobile Tests – Android
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      APK_VERSION: v1.0.8
      APK_NAME: wdio-native-demo-app.apk
      APK_PATH: mobile-tests/apps/wdio-native-demo-app.apk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-node-modules-android
        with:
          path: |
            node_modules
            mobile-tests/node_modules
          key: mobile-node-modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            mobile-node-modules-${{ runner.os }}-

      - name: Install dependencies
        if: steps.cache-node-modules-android.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile

      - name: Copy environment file
        working-directory: mobile-tests
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          fi

      # ✅ FORÇA USO DO PATH DO CONTAINER (ESSENCIAL)
      - name: Configure Android app path for Docker
        working-directory: mobile-tests
        run: |
          echo "ANDROID_APP_CONTAINER_PATH=/apps/${APK_NAME}" >> .env

      # ✅ CACHE DO APK
      - name: Cache APK
        uses: actions/cache@v4
        id: cache-apk
        with:
          path: mobile-tests/apps
          key: apk-${{ runner.os }}-${{ env.APK_VERSION }}

      # ✅ DOWNLOAD SOMENTE SE NÃO ESTIVER EM CACHE
      - name: Download APK
        if: steps.cache-apk.outputs.cache-hit != 'true'
        run: |
          mkdir -p mobile-tests/apps
          curl -L -o $APK_PATH https://github.com/webdriverio/native-demo-app/releases/download/${APK_VERSION}/android.wdio.native.app.${APK_VERSION}.apk

      # 🔎 VALIDAÇÃO (EVITA SEU ERRO)
      - name: Validate APK
        run: |
          if [ ! -f "$APK_PATH" ]; then
            echo "❌ APK não encontrado em $APK_PATH"
            exit 1
          fi
          echo "✅ APK encontrado:"
          ls -la mobile-tests/apps

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install adb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y android-tools-adb
          adb version

      - name: Start Docker Compose
        working-directory: mobile-tests
        run: docker compose up -d

      # 🔎 DEBUG DE VOLUME (OURO PRA NÃO SOFRER)
      - name: Debug APK inside container
        run: |
          echo "Host:"
          ls -la mobile-tests/apps

          CONTAINER_ID=$(docker ps -q | head -n 1)
          echo "Container ID: $CONTAINER_ID"

          docker exec $CONTAINER_ID ls -la /apps || echo "⚠️ /apps não encontrado"

      - name: Wait for emulator boot
        run: |
          adb wait-for-device
          until adb shell getprop sys.boot_completed | grep -m 1 '1'; do
            echo "⏳ aguardando boot..."
            sleep 5
          done
          adb shell input keyevent 82

      - name: Wait for Appium
        working-directory: mobile-tests
        run: node scripts/wait-for-appium.js

      - name: Run Android tests
        working-directory: mobile-tests
        run: yarn test:android

      - name: Stop Docker Compose
        if: always()
        working-directory: mobile-tests
        run: docker compose down

      - name: Upload Android test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report-${{ github.run_number }}
          path: |
            mobile-tests/allure-results/
            mobile-tests/reports/

  # ─────────────────────────────────────────────
  # JOB 3 – iOS (PRONTO PRA APP REAL)
  # ─────────────────────────────────────────────
  mobile-ios:
    name: Mobile Tests – iOS
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-node-modules-ios
        with:
          path: |
            node_modules
            mobile-tests/node_modules
          key: mobile-node-modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            mobile-node-modules-${{ runner.os }}-

      - name: Install dependencies
        if: steps.cache-node-modules-ios.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile

      - name: Copy environment file
        working-directory: mobile-tests
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Prepare iOS app
        working-directory: mobile-tests
        run: |
          mkdir -p apps
          echo "⚠️ Adicione aqui o download do .app ou .ipa quando disponível"

      - name: Install Appium and drivers
        run: |
          yarn global add appium
          appium driver install xcuitest

      - name: Boot iOS Simulator
        run: |
          DEVICE="iPhone 15"
          UDID=$(xcrun simctl list devices | grep "$DEVICE (" | head -n 1 | awk -F '[()]' '{print $2}')
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Start Appium server
        working-directory: mobile-tests
        run: |
          appium &
          sleep 10

      - name: Wait for Appium
        working-directory: mobile-tests
        run: node scripts/wait-for-appium.js

      - name: Run iOS tests
        working-directory: mobile-tests
        run: yarn test:ios

      - name: Upload iOS test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-report-${{ github.run_number }}
          path: |
            mobile-tests/allure-results/
            mobile-tests/reports/