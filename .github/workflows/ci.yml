name: CI – API & Mobile Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  NODE_VERSION: '22'

# Cancela execuções anteriores ainda em andamento para a mesma branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 – Testes de API
  # ─────────────────────────────────────────────
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-node-modules-api
        with:
          path: |
            node_modules
            api-tests/node_modules
          key: api-node-modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            api-node-modules-${{ runner.os }}-

      - name: Install dependencies
        if: steps.cache-node-modules-api.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile

      - name: Copy environment file
        working-directory: api-tests
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Run API tests
        working-directory: api-tests
        run: yarn test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report-${{ github.run_number }}
          path: |
            api-tests/mochawesome-report/
            api-tests/reports/
          if-no-files-found: warn
          retention-days: 7

  # ─────────────────────────────────────────────
  # JOB 2 – Testes Mobile Android (Appium + Docker)
  # ─────────────────────────────────────────────
  mobile-android:
    name: Mobile Tests – Android
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-node-modules-android
        with:
          path: |
            node_modules
            mobile-tests/node_modules
          key: mobile-node-modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            mobile-node-modules-${{ runner.os }}-

      - name: Install dependencies
        if: steps.cache-node-modules-android.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile

      - name: Copy environment file
        working-directory: mobile-tests
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Enable KVM (hardware acceleration for Android emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start Appium server via Docker Compose
        working-directory: mobile-tests
        run: |
          docker compose up -d
          node scripts/wait-for-appium.js

      - name: Run Android tests
        working-directory: mobile-tests
        run: yarn test:android

      - name: Stop Docker Compose
        if: always()
        working-directory: mobile-tests
        run: docker compose down

      - name: Upload Android test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report-${{ github.run_number }}
          path: |
            mobile-tests/allure-results/
            mobile-tests/reports/
          if-no-files-found: warn
          retention-days: 7

  # ─────────────────────────────────────────────
  # JOB 3 – Testes Mobile iOS (Appium + Simulator)
  # ─────────────────────────────────────────────
  mobile-ios:
    name: Mobile Tests – iOS
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-node-modules-ios
        with:
          path: |
            node_modules
            mobile-tests/node_modules
          key: mobile-node-modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            mobile-node-modules-${{ runner.os }}-

      - name: Install dependencies
        if: steps.cache-node-modules-ios.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile

      - name: Copy environment file
        working-directory: mobile-tests
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Install Appium and drivers
        run: |
          yarn global add appium
          appium driver install xcuitest

      - name: Start Appium server
        working-directory: mobile-tests
        run: |
          appium &
          node scripts/wait-for-appium.js

      - name: Run iOS tests
        working-directory: mobile-tests
        run: yarn test:ios

      - name: Upload iOS test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-report-${{ github.run_number }}
          path: |
            mobile-tests/allure-results/
            mobile-tests/reports/
          if-no-files-found: warn
          retention-days: 7
