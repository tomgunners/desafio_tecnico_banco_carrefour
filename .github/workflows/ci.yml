name: CI – API & Mobile Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  NODE_VERSION: '22'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ─────────────────────────────
  # API TESTS
  # ─────────────────────────────
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: api-tests

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ./api-tests/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Copy .env
        run: |
          [ -f .env.example ] && cp .env.example .env

      - name: Run API tests
        run: npm test

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report-${{ github.run_number }}
          path: |
            api-tests/mochawesome-report/
            api-tests/reports/
          retention-days: 7


  # ─────────────────────────────
  # MOBILE ANDROID
  # ─────────────────────────────
  mobile-android:
    name: Mobile Tests – Android
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: mobile-tests

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ./mobile-tests/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Copy .env
        run: |
          [ -f .env.example ] && cp .env.example .env

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start Appium (Docker)
        run: |
          docker compose up -d
          node scripts/wait-for-appium.js

      - name: Run Android tests
        run: npm run test:android

      - name: Stop Docker
        if: always()
        run: docker compose down

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report-${{ github.run_number }}
          path: |
            mobile-tests/allure-results/
            mobile-tests/reports/
          retention-days: 7


  # ─────────────────────────────
  # MOBILE IOS
  # ─────────────────────────────
  mobile-ios:
    name: Mobile Tests – iOS
    runs-on: macos-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: mobile-tests

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ./mobile-tests/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Copy .env
        run: |
          [ -f .env.example ] && cp .env.example .env

      - name: Install Appium
        run: |
          npm install -g appium
          appium driver install xcuitest

      - name: Start Appium
        run: |
          appium &
          node scripts/wait-for-appium.js

      - name: Run iOS tests
        run: npm run test:ios

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-report-${{ github.run_number }}
          path: |
            mobile-tests/allure-results/
            mobile-tests/reports/
          retention-days: 7