name: API Tests — Banco Carrefour

on:
  push:
    branches: [main, develop]
    paths:
      - 'api-tests/**'
      - '.github/workflows/api-tests.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'api-tests/**'
      - '.github/workflows/api-tests.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  WORKING_DIR: api-tests

jobs:
  api-tests:
    name: Executar testes de API
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout do repositório
        uses: actions/checkout@v4

      # ── Node.js ─────────────────────────────────────────────────────────────
      - name: Configurar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      # ── Dependências ────────────────────────────────────────────────────────
      - name: Instalar dependências
        run: npm install

      # ── Typecheck ───────────────────────────────────────────────────────────
      - name: Verificar tipos TypeScript
        run: npm run typecheck

      # ── Testes ──────────────────────────────────────────────────────────────
      - name: Executar suíte de testes (Mochawesome)
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://dummyjson.com' }}
          REQUEST_TIMEOUT: ${{ vars.REQUEST_TIMEOUT || '15000' }}
          AUTH_USERNAME: ${{ secrets.AUTH_USERNAME || 'emilys' }}
          AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD || 'emilyspass' }}
          TEST_ENV: CI
          CI: 'true'
        run: npm test

      - name: Executar suíte de testes (Allure)
        if: always()
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://dummyjson.com' }}
          REQUEST_TIMEOUT: ${{ vars.REQUEST_TIMEOUT || '15000' }}
          AUTH_USERNAME: ${{ secrets.AUTH_USERNAME || 'emilys' }}
          AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD || 'emilyspass' }}
          TEST_ENV: CI
          CI: 'true'
        run: npm run test:allure || true

      # ── Relatório Mochawesome ────────────────────────────────────────────────
      - name: Publicar relatório Mochawesome
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mochawesome-report-${{ github.run_number }}
          path: ${{ env.WORKING_DIR }}/reports/mochawesome/
          retention-days: 30

      # ── Relatório Allure ─────────────────────────────────────────────────────
      - name: Instalar Allure CLI
        if: always()
        run: npm install -g allure-commandline --save-dev

      - name: Gerar relatório Allure
        if: always()
        run: allure generate allure-results -o allure-report --clean

      - name: Publicar resultados Allure (raw)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-${{ github.run_number }}
          path: ${{ env.WORKING_DIR }}/allure-results/
          retention-days: 30

      - name: Publicar relatório Allure (HTML)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report-api-${{ github.run_number }}
          path: ${{ env.WORKING_DIR }}/allure-report/
          retention-days: 30

      # ── Deploy Allure para GitHub Pages ─────────────────────────────────────
      - name: Deploy do relatório Allure no GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main' && always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.WORKING_DIR }}/allure-report
          destination_dir: api
          keep_files: true
